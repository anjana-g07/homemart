<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeMart - Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">🏠 HomeMart</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="cart.html">🛒 Cart</a></li>
            <li><a href="login.html">👤 Login</a></li>
        </ul>
    </nav>
</header>

<main class="checkout-page">

    <h1>Checkout</h1>

    <div class="checkout-grid">

        <!-- SHIPPING -->
        <section class="checkout-form">

            <h2>Shipping Address</h2>

            <form id="checkoutForm">

                <label>Full Name</label>
                <input type="text" id="fullName" required>

                <label>Phone Number</label>
                <input type="tel" id="phone" required>

                <label>Address</label>
                <textarea id="address" rows="4" required></textarea>

                <label>City</label>
                <input type="text" id="city" required>

                <label>PIN Code</label>
                <input type="text" id="pincode" required>

                <h2>Payment Method</h2>

                <label class="payment-option">
                    <input type="radio"
                           name="payment"
                           value="Cash on Delivery"
                           required>
                    Cash on Delivery
                </label>

                <label class="payment-option">
                    <input type="radio"
                           name="payment"
                           value="UPI">
                    UPI
                </label>

                <label class="payment-option">
                    <input type="radio"
                           name="payment"
                           value="Card">
                    Credit / Debit Card
                </label>

                <h2>Delivery</h2>

                <select id="delivery">
                    <option value="0">Standard Delivery - FREE</option>
                    <option value="499">Express Delivery - ₹499</option>
                </select>

                <button type="submit" class="btn place-order-btn">
                    Place Order
                </button>

            </form>

        </section>


        <!-- ORDER SUMMARY -->
        <section class="checkout-summary">

            <h2>Order Summary</h2>

            <div id="checkoutItems"></div>

            <hr>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">₹0</strong>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <strong id="deliveryCost">FREE</strong>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <strong id="checkoutTotal">₹0</strong>
            </div>

        </section>

    </div>

</main>

<footer>
    <p>© 2026 HomeMart. All Rights Reserved.</p>
</footer>

<script src="js/products.js"></script>
<script src="js/script.js"></script>

</body>
</html>
