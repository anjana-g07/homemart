<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeMart - Products</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">🏠 HomeMart</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html">🛒 Cart</a></li>
            <li><a href="login.html">👤 Login</a></li>
        </ul>
    </nav>
</header>


<main class="products-page">

    <section class="products-header">
        <h1>Our Furniture Collection</h1>
        <p>Discover furniture made for beautiful homes.</p>
    </section>


    <!-- SEARCH -->
    <section class="product-controls">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search furniture..."
        >

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Living Room">Living Room</option>
            <option value="Bedroom">Bedroom</option>
            <option value="Dining">Dining</option>
            <option value="Office">Office</option>
        </select>

        <select id="materialFilter">
            <option value="all">All Materials</option>
            <option value="Wood">Wood</option>
            <option value="Fabric">Fabric</option>
            <option value="Leather">Leather</option>
        </select>

        <select id="priceFilter">
            <option value="all">All Prices</option>
            <option value="10000">Under ₹10,000</option>
            <option value="20000">Under ₹20,000</option>
            <option value="30000">Under ₹30,000</option>
        </select>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section">

        <div id="productGrid" class="shop-grid"></div>

    </section>

</main>


<footer>
    <p>© 2026 HomeMart. All Rights Reserved.</p>
</footer>


<script src="js/products.js"></script>
<script src="js/script.js"></script>

</body>
</html>
<select id="sortFilter">
    <option value="default">Sort By</option>
    <option value="low">Price: Low to High</option>
    <option value="high">Price: High to Low</option>
    <option value="rating">Highest Rated</option>
</select>
